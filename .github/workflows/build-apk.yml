name: Build StickerStudio APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download AI segmentation model to bundle in APK
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-all-errors --output app/src/main/assets/silueta.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/silueta.onnx
          echo '55e59e0d8062d2f5d013f4725ee84782  app/src/main/assets/silueta.onnx' | md5sum --check
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StickerStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error